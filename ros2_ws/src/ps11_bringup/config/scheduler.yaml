# Semantic telemetry scheduler configuration (§11.7)
policy: "semantic"  # semantic (proposed) or fifo_observations (baseline B)

heartbeat:
  max_period_s: 15.0
  min_period_s: 5.0

scoring:
  update_min_move_m: 1.0
  update_sigma_ratio: 0.5
  update_novelty: 0.3
  age_boost_tau_s: 30.0
  age_boost_max_s: 60.0

battery:
  # Simulated linear battery drain per hour (0.0 to 1.0 fraction)
  drain_per_hour: 0.1  # ASSUMPTION: simulated battery drain
